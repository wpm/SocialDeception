# A seven-player game of Werewolf.
#
# Run it with:
#
#     cargo run --bin werewolf -- play examples/werewolf.toml

# The master seed. Every generator in the episode is derived from it, so a
# run is reproducible from this file alone.
seed = 20260918

# The players. Their order here does not affect the deal.
players = ["alice", "bob", "carol", "dave", "erin", "frank", "grace"]

# Where to write the trajectory. Optional: leave it out to write nothing.
trajectory = "werewolf.jsonl"

# The moderator's agent id. Optional, default "moderator". No player may
# share it.
moderator = "moderator"

# How many of each special role to deal. Villagers are whatever is left over.
# Seers and doctors are optional, default 0, and at most one of each.
[roles]
werewolves = 2
seers = 1
doctors = 1

# The clocks the selection sessions run on. Optional: every field has a
# default, and the defaults suit a game played by language models.
#
# These values are short so that a game of random players, which select once
# and never change their minds, finishes in a second or so. A game played by
# models wants far longer ones — a pack needs time to argue — so start from
# the defaults there: one second of quiet and twenty of limit for each night
# session, and sixty for the day.
[timing]
# Days before a game that nobody has won ends as a stalemate, which pays -1
# to everyone. Optional, default the number of players.
day_cap = 7

# A night session closes when every member has selected and no selection has
# changed for `quiet` seconds, or at `limit` seconds, whichever comes first.
[timing.pack]
quiet = 0.05
limit = 0.5

[timing.seer]
quiet = 0.05
limit = 0.5

[timing.doctor]
quiet = 0.05
limit = 0.5

# The day closes on a majority of the living, or at `limit` seconds with
# nobody lynched. It has no quiet period.
[timing.day]
limit = 0.5
