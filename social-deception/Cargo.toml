[package]
name = "social-deception"
description = "A framework for real-time, turnless multi-agent environments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run` with no `--bin` runs this one.
default-run = "social-deception"

[lib]
name = "social_deception"
path = "src/lib.rs"

[[bin]]
name = "social-deception"
path = "src/main.rs"

[[bin]]
name = "werewolf"
path = "src/bin/werewolf.rs"

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rand.workspace = true
rand_chacha.workspace = true
clap.workspace = true

[lints]
workspace = true
